"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
name = "David Crespo"
email = "crespo.dm@gmail.com"

[[--scope]]
--when.repositories = ["~/oxide"]
[--scope.user]
email = "david.crespo@oxidecomputer.com"

[remotes.origin]
auto-track-created-bookmarks = "*"

[remotes.mine]
auto-track-created-bookmarks = "*"

# Delta uses less by default but doesn't pass -X to it, which would the last
# page stick around after quit. I could use
#
#   pager = ["delta", "--pager", "less -FRX"]
#
# but I don't want this behavior on diffs, only the commit log, where I'm
# trying to look at a change ID. So instead what I've done is map Q to toggle
# --redraw-on-quit on before quitting. See ./lesskey.
# https://github.com/gwsw/less/issues/36#issuecomment-913200056

[ui]
# Share width-aware Delta rendering with jjui.
pager = ["jj", "delta"]
default-command = ["log", "--template", "home"]
diff-editor = ":builtin"
merge-editor = "vscode"
diff-formatter = ":git"

[revsets]
# builtin_log() shows 2 ancestors and I found it wasn't enough. divergent()
# surfaces divergent changes that the other terms wouldn't show, but fetch
# imports every *@origin ref, so a bare divergent() floods the log with other
# people's divergences. So we scope it to mine() (changes I authored, on any
# branch) | ::@ (ancestors of my checkout, so someone else's divergent commit
# on a branch I'm contributing to still shows).
log = "builtin_log() | ancestors(immutable_heads().., 4) | (divergent() & (mine() | ::@)) | ancestors(bookmarks(), 3)"

[revset-aliases]
# Treat commits not authored by me as immutable. The `trunk().. &` bit is an
# optimization to scan for non-`mine()` commits only among commits that are not
# in `trunk()`.
# https://jj-vcs.github.io/jj/v0.26.0/config/#set-of-immutable-commits
"immutable_heads()" = "builtin_immutable_heads() | (trunk().. & ~mine())"
"fork(x)" = "fork_point(trunk() | x)"
"fork()" = "fork_point(trunk() | @)"
# These are plural because merge ancestry can have multiple closest bookmarks.
"closest_bookmarks(to)" = "heads(::to & bookmarks())"
"stack_bookmarks(to)" = "bookmarks() & trunk()..to"
"closest_stack_bookmarks(to)" = "heads(stack_bookmarks(to))"

[fileset-aliases]
# lock files are noise in local diffs; exclude with `~lockfiles` (see dt below)
'lockfiles' = 'glob:"**/package-lock.json" | glob:"**/Cargo.lock" | glob:"**/deno.lock" | glob:"**/bun.lock"'

[aliases]
# A stdin filter, also used as ui.pager. --ignore-working-copy avoids taking
# another snapshot just to format output. The final string sets bash's $0 so
# supplied Delta options start at $1 and are all included in "$@".
delta = ["--ignore-working-copy", "util", "exec", "--", "bash", "-c", '''
  # jjui supplies the preview pane width in COLUMNS. With terminal output,
  # use the actual terminal width instead, including after a resize.
  width=${COLUMNS:-80}
  if [ -t 1 ]; then read -r _ width < <(stty size </dev/tty); fi

  # --width keeps Delta from formatting a preview for the outer terminal.
  args=(--width="$width")
  # --side-by-side needs enough room for two columns; match the 165-column
  # threshold previously used by the ordinary jj pager.
  if [ "$width" -ge 165 ]; then args+=(--side-by-side); fi

  # Forward pager options: jjui previews use --paging=never because jjui
  # handles scrolling; the full-screen diff uses --pager 'less -R' to keep
  # even a short diff open until quit, displaying ANSI colors correctly.
  exec delta "${args[@]}" "$@"
  ''', "jj delta"]
# Run a jj command through the filter. --no-pager avoids formatting twice;
# --paging=never leaves scrolling to jjui's preview pane.
delta-preview = ["--ignore-working-copy", "util", "exec", "--", "bash", "-c", '''
  jj --no-pager "$@" | jj delta --paging=never
  ''', "jj delta-preview"]
d = ["diff"]
dm = ["describe", "-m"]
dp = ["describe", "-r", "@-"]
# diff rev against fork point like GitHub PR diff or git ...
# dt/dts exclude lock files; dta/dtas show all files.
# Baked-in args can be overridden since jj 0.44 (last occurrence wins), e.g.
# `jj dt -f <rev>` for a different base (lower in a stack). Fileset args are
# unioned rather than intersected, so narrowing to a path still requires
# dropping to jj diff directly:
#   jj diff -f <rev> '<path> & ~lockfiles'
dt = ["diff", "--from", "fork()", "~lockfiles"]
dts = ["diff", "--stat", "--from", "fork()", "~lockfiles"]
dta = ["diff", "--from", "fork()"]
dtsa = ["diff", "--stat", "--from", "fork()"]
rp = ["log", "--no-graph", "-T", "commit_id"]
ds = ["diff", "--stat"]
cm = ["commit"]
# move the closest ancestor bookmark to @-. prefers non-trunk bookmarks so
# that merging trunk doesn't drag the trunk bookmark forward. falls back to
# including trunk if it's the only ancestor bookmark. the jj log prints "x"
# per matching rev; grep -q tests whether there's any output (i.e., the
# revset matched something). if not, we widen the revset to include trunk.
tug = ["util", "exec", "--", "zsh", "-c", '''
  from='closest_stack_bookmarks(@)'
  jj --no-pager log -r "$from" --no-graph -T '"x"' 2>/dev/null | grep -q . || from='closest_bookmarks(@)'
  jj bookmark move --from "$from" --to '@-'
  ''', 'jj tug']
# jj collapse START [END]
# squash START::END into START
# second arg optional. if left out does all descendants of START
collapse = ["util", "exec", "--", "zsh", "-c", '''
  jj squash -f "$1"::"$2" -t "$1"
  ''', 'jj collapse']
watch = ["util", "exec", "--", "zsh", "-c", '''
  watchexec --quiet --clear --restart --watch=.jj/repo/op_heads/heads --ignore-nothing --wrap-process=none -- jj --ignore-working-copy
  ''', 'jj watch']
spr = ["util", "exec", "--", "jj-spr"]
# merge trunk into rev. doesn't move any bookmarks
mm = ["util", "exec", "--", "zsh", "-c", '''
  jj new "$1" 'trunk()' -m 'merge trunk' && jj new
  ''', 'jj mm']

[template-aliases]
# log with diff stats for working copy or revs without descriptions. The  |
# separator has to be swapped out because jjui uses | as a separator when
# parsing lines
'home' = '''
builtin_log_compact ++ if(
  (self.current_working_copy() || self.description().len() == 0) && !self.empty(),
  "\n" ++ stringify(self.diff().stat()).replace("|", "｜") ++ "\n"
)
'''

# Username part of the email address
'format_short_signature(signature)' = 'signature.email().local()'

# format_commit_summary_with_refs minus the git commit, and remove empty label
# color from description_placeholder
# https://github.com/jj-vcs/jj/blob/faa689a7/cli/src/config/templates.toml#L192C1
'zsh_prompt_summary(commit, refs)' = '''
separate(" ",
  format_short_change_id_with_change_offset(commit),
  if(commit.conflict(), label("conflict", "(conflict)")),
  if(commit.empty(),
    label("empty", "(empty)"),
  ),
  if(commit.description(),
    commit.description().first_line(),
    label("description placeholder", "(no desc)")
  ),
)
'''
