<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>hx-web</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown.min.css">
<style>
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
  #left { background: #1e2127; padding: 8px; min-width: 0; }
  #term, #term .terminal { height: 100%; }
  #preview {
    min-width: 0;
    overflow-y: auto;
    padding: 24px 32px;
    box-sizing: border-box;
    background: #ffffff;
  }
  @media (prefers-color-scheme: dark) { #preview { background: #0d1117; } }
</style>
</head>
<body>
<div id="left"><div id="term"></div></div>
<div id="preview" class="markdown-body"></div>
<script>
  // ?preview renders only the markdown pane (for terminal-browser etc.,
  // where the editor is a real hx in a sibling terminal pane)
  const previewOnly = new URLSearchParams(location.search).has("preview")
  if (previewOnly) {
    document.getElementById("left").remove()
    document.body.style.gridTemplateColumns = "1fr"
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script>
  if (!previewOnly) {
    const term = new Terminal({ fontSize: 14, fontFamily: "Menlo, monospace" })
    const fit = new FitAddon.FitAddon()
    term.loadAddon(fit)
    term.open(document.getElementById("term"))
    fit.fit()

    const ptyWs = new WebSocket(`ws://${location.host}/pty`)
    ptyWs.onopen = () => {
      ptyWs.send(`\x00resize:${term.cols}x${term.rows}`)
      term.onData((d) => ptyWs.send(d))
      window.addEventListener("resize", () => {
        fit.fit()
        ptyWs.send(`\x00resize:${term.cols}x${term.rows}`)
      })
    }
    ptyWs.onmessage = (e) => term.write(e.data)
    ptyWs.onclose = () => term.write("\r\n[disconnected]\r\n")
  }

  // Edits reach disk via helix auto-save. Consume the reflexive macOS save
  // shortcut before the browser can open its Save Page UI.
  document.addEventListener(
    "keydown",
    (event) => {
      if (
        event.metaKey &&
        !event.ctrlKey &&
        !event.altKey &&
        !event.shiftKey &&
        event.key.toLowerCase() === "s"
      ) {
        event.preventDefault()
        event.stopPropagation()
      }
    },
    { capture: true },
  )

  const previewWs = new WebSocket(`ws://${location.host}/preview`)
  previewWs.onmessage = (e) => {
    document.getElementById("preview").innerHTML = marked.parse(e.data)
  }
</script>
</body>
</html>
