[revisions]
template = "home"

[ui.colors]
"selected" = { bg = "#292929" }

[preview]
# jj delta uses jjui's pane-sized COLUMNS; jjui handles preview scrolling.
revision_command = ["delta-preview", "show", "--color", "always", "--git", "-r", "$change_id"]
oplog_command = ["delta-preview", "op", "show", "$operation_id", "--git", "--color", "always"]
file_command = ["delta-preview", "diff", "--color", "always", "--git", "-r", "$change_id", "$file"]

[[actions]]
name = "delta-diff"
lua = '''jj_interactive("util", "exec", "--", "bash", "-c",
  "jj --no-pager show --summary --git --color=always -r " .. context.change_id() ..
  " | jj delta --pager 'less -R'")'''

[[bindings]]
action = "delta-diff"
key = "d"
scope = "revisions"
desc = "diff (delta)"
